{% extends "courses/base.html" %}

{% block title %}{{ page_title }} — Платформа курсов{% endblock %}

{% block content %}
    <a
        class="back-link"
        href="{% url 'courses:course_manage' lesson.course_id %}"
    >
        Вернуться к материалам курса
    </a>

    <section class="surface">
        <p class="eyebrow">Урок: {{ lesson.title }}</p>
        <h1>{{ page_title }}</h1>

        <form class="platform-form" method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">
                <button class="button" type="submit">
                    Сохранить
                </button>
                <a href="{% url 'courses:course_manage' lesson.course_id %}">
                    Отмена
                </a>
            </div>
        </form>
    </section>
{% endblock %}
